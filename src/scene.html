<!doctype html>
<meta charset="utf-8">
<title>slot scene</title>
<style>
  :root { --rad: 52px; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#000; overflow:hidden; }

  #stage { position:relative; overflow:hidden; transform-origin:0 0; }

  /* ---- base plate (the footage) ---- */
  #plate { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }

  /* ---- the liquid glass panel ---------------------------------------- */
  #panel {
    position:absolute;
    border-radius:var(--rad);
    overflow:hidden;
    isolation:isolate;
    border:1px solid rgba(255,255,255,.34);
    /* the refraction itself: blur + saturate the footage behind */
    backdrop-filter: blur(var(--blur)) saturate(var(--sat)) brightness(var(--bri));
    -webkit-backdrop-filter: blur(var(--blur)) saturate(var(--sat)) brightness(var(--bri));
    background:
      linear-gradient(147deg,
        rgba(255,255,255,calc(var(--tint) * 1.7)) 0%,
        rgba(255,255,255,calc(var(--tint) * 0.35)) 38%,
        rgba(255,255,255,calc(var(--tint) * 0.5)) 62%,
        rgba(255,255,255,calc(var(--tint) * 1.35)) 100%);
    box-shadow:
      inset 0  1px 0 rgba(255,255,255,.72),
      inset 0 -1px 0 rgba(255,255,255,.30),
      inset  1px 0 0 rgba(255,255,255,.40),
      inset -1px 0 0 rgba(255,255,255,.40),
      inset 0 0 60px rgba(255,255,255,.06),
      0 24px 64px rgba(0,0,0,.16);
  }

  /* the liquid rim: a band at the very edge that displaces the backdrop,
     so light *bends* around the border instead of just frosting */
  #rim {
    position:absolute; inset:0; border-radius:var(--rad);
    backdrop-filter: url(#liquid) blur(1px);
    -webkit-backdrop-filter: url(#liquid) blur(1px);
    /* mask to a band hugging the edge */
    -webkit-mask:
      linear-gradient(#000 0 0) content-box exclude,
      linear-gradient(#000 0 0);
    mask:
      linear-gradient(#000 0 0) content-box exclude,
      linear-gradient(#000 0 0);
    mask-composite: exclude;
    padding: var(--rimw);
    pointer-events:none;
  }

  /* specular sweep across the glass */
  #spec {
    position:absolute; inset:0; border-radius:var(--rad); pointer-events:none;
    background:
      radial-gradient(130% 80% at 18% -8%,  rgba(255,255,255,.17), rgba(255,255,255,0) 52%),
      radial-gradient(100% 65% at 92% 108%, rgba(255,255,255,.10), rgba(255,255,255,0) 58%);
    mix-blend-mode: screen;
  }

  /* ---- reels --------------------------------------------------------- */
  #reels { position:absolute; inset:0; display:flex; }
  .reel {
    position:relative; flex:1 1 0; overflow:hidden;
    /* feather the slot window so products enter and leave the reel softly
       instead of being sliced flat by the panel edge */
    -webkit-mask: linear-gradient(180deg,
      transparent 0, #000 7%, #000 93%, transparent 100%);
    mask: linear-gradient(180deg,
      transparent 0, #000 7%, #000 93%, transparent 100%);
  }
  .reel + .reel::before {
    content:""; position:absolute; left:0; top:6%; bottom:6%; width:1px;
    background:linear-gradient(180deg,
      rgba(255,255,255,0), rgba(255,255,255,.42) 15%,
      rgba(255,255,255,.42) 85%, rgba(255,255,255,0));
  }
  .strip { position:absolute; left:0; width:100%; will-change:transform; }
  .cell  { width:100%; display:flex; align-items:center; justify-content:center; }
  .cell img { width:100%; height:100%; object-fit:contain; display:block; }

  /* ---- wordmark ------------------------------------------------------ */
  #wordmark {
    position:absolute; left:0; right:0; top:50%; transform:translateY(-50%);
    text-align:center; color:#fff; pointer-events:none;
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    font-weight:400; white-space:nowrap;
    text-shadow:0 2px 18px rgba(0,0,0,.30);
  }

  /* ---- hero (winning product, scaled up, no glass) ------------------- */
  #hero { position:absolute; left:50%; top:50%; transform-origin:50% 50%; pointer-events:none; }
  #hero img { width:100%; height:100%; object-fit:contain; display:block; }

  /* ---- packshot + end card ------------------------------------------ */
  #packshot { position:absolute; inset:0; background:#fff; display:flex;
              align-items:center; justify-content:center; }
  #packshot img { width:62%; height:62%; object-fit:contain; }
  #endcard { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  #endcard span { color:#fff; font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; font-weight:400; white-space:nowrap; }
</style>

<div id="stage">
  <img id="plate" src="">
  <div id="panel">
    <div id="reels"></div>
    <div id="spec"></div>
    <div id="rim"></div>
    <div id="wordmark"></div>
  </div>
  <div id="hero"><img src=""></div>
  <div id="packshot"><img src=""></div>
  <div id="endcard"><span></span></div>
</div>

<!-- displacement map that gives the rim its liquid bend -->
<svg width="0" height="0" style="position:absolute">
  <filter id="liquid" x="-20%" y="-20%" width="140%" height="140%"
          color-interpolation-filters="sRGB">
    <feTurbulence id="turb" type="fractalNoise" baseFrequency="0.011 0.015"
                  numOctaves="2" seed="9" result="noise"/>
    <feGaussianBlur in="noise" stdDeviation="1.2" result="softnoise"/>
    <feDisplacementMap in="SourceGraphic" in2="softnoise" scale="16"
                       xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<script src="slot.js"></script>
