<!doctype html>
<meta charset="utf-8">
<title>slot scene</title>
<style>
  :root { --rad: 62px; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#000; overflow:hidden; }

  #stage { position:relative; overflow:hidden; transform-origin:0 0; background:#000; }

  /* ---- base plate (the footage) ---- */
  #plate { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }

  /* ---- the liquid glass panel ---------------------------------------- */
  #panel {
    position:absolute;
    border-radius:var(--rad);
    overflow:hidden;
    isolation:isolate;
    border:1px solid rgba(255,255,255,.34);
    backdrop-filter: blur(var(--blur)) saturate(var(--sat)) brightness(var(--bri));
    -webkit-backdrop-filter: blur(var(--blur)) saturate(var(--sat)) brightness(var(--bri));
    background:
      linear-gradient(147deg,
        rgba(255,255,255,calc(var(--tint) * 1.7)) 0%,
        rgba(255,255,255,calc(var(--tint) * 0.35)) 38%,
        rgba(255,255,255,calc(var(--tint) * 0.5)) 62%,
        rgba(255,255,255,calc(var(--tint) * 1.35)) 100%);
    box-shadow:
      inset 0  1px 0 rgba(255,255,255,.72),
      inset 0 -1px 0 rgba(255,255,255,.30),
      inset  1px 0 0 rgba(255,255,255,.40),
      inset -1px 0 0 rgba(255,255,255,.40),
      inset 0 0 60px rgba(255,255,255,.06),
      0 24px 64px rgba(0,0,0,.16);
  }

  /* liquid rim: a band at the edge that displaces the backdrop, so light
     bends around the border instead of only frosting */
  #rim {
    position:absolute; inset:0; border-radius:var(--rad);
    backdrop-filter: url(#liquid) blur(1px);
    -webkit-backdrop-filter: url(#liquid) blur(1px);
    -webkit-mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
    mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
    mask-composite: exclude;
    padding: var(--rimw);
    pointer-events:none;
  }

  #spec {
    position:absolute; inset:0; border-radius:var(--rad); pointer-events:none;
    background:
      radial-gradient(130% 80% at 18% -8%,  rgba(255,255,255,.17), rgba(255,255,255,0) 52%),
      radial-gradient(100% 65% at 92% 108%, rgba(255,255,255,.10), rgba(255,255,255,0) 58%);
    mix-blend-mode: screen;
  }

  /* ---- reels --------------------------------------------------------- */
  #reels { position:absolute; inset:0; display:flex; }
  .reel {
    position:relative; flex:1 1 0; overflow:hidden;
    /* feather the slot window so products enter and leave softly instead of
       being sliced flat by the panel edge */
    -webkit-mask: linear-gradient(180deg, transparent 0, #000 7%, #000 93%, transparent 100%);
    mask: linear-gradient(180deg, transparent 0, #000 7%, #000 93%, transparent 100%);
  }
  .reel + .reel::before {
    content:""; position:absolute; left:0; top:6%; bottom:6%; width:1px; z-index:2;
    background:linear-gradient(180deg,
      rgba(255,255,255,0), rgba(255,255,255,.42) 15%,
      rgba(255,255,255,.42) 85%, rgba(255,255,255,0));
  }
  .strip { position:absolute; left:0; width:100%; will-change:transform; }

  /* impact bloom across the whole panel, fired on launch and on each stop */
  #flash {
    position:absolute; inset:0; border-radius:var(--rad); pointer-events:none;
    background:radial-gradient(120% 90% at 50% 50%,
      rgba(255,255,255,.62), rgba(255,255,255,.20) 52%, rgba(255,255,255,0) 80%);
    mix-blend-mode:screen; opacity:0;
  }

  /* per-reel light sweep that runs down the cell as the detent catches */
  #sweeps { position:absolute; inset:0; display:flex; pointer-events:none; z-index:3; }
  .sweep { position:relative; flex:1 1 0; overflow:hidden; }
  .sweep i {
    position:absolute; left:-10%; width:120%; height:46%; display:block;
    background:linear-gradient(180deg,
      rgba(255,255,255,0), rgba(255,255,255,.55) 48%, rgba(255,255,255,0));
    mix-blend-mode:screen; opacity:0;
  }

  /* the mimed slot handle */
  #lever { position:absolute; inset:0; width:100%; height:100%;
           pointer-events:none; overflow:visible; }
  #leverG { opacity:0; }
  .cell  { width:100%; display:flex; align-items:center; justify-content:center; }
  .cell img { width:100%; height:100%; object-fit:contain; display:block; }
</style>

<div id="stage">
  <img id="plate" src="">
  <svg id="lever" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="rodg" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0"   stop-color="#ffffff" stop-opacity=".18"/>
        <stop offset=".34" stop-color="#ffffff" stop-opacity=".78"/>
        <stop offset=".62" stop-color="#ffffff" stop-opacity=".30"/>
        <stop offset="1"   stop-color="#ffffff" stop-opacity=".10"/>
      </linearGradient>
      <radialGradient id="knobg" cx=".36" cy=".30" r=".78">
        <stop offset="0"   stop-color="#ffffff" stop-opacity=".95"/>
        <stop offset=".34" stop-color="#ffffff" stop-opacity=".40"/>
        <stop offset=".72" stop-color="#ffffff" stop-opacity=".14"/>
        <stop offset="1"   stop-color="#ffffff" stop-opacity=".30"/>
      </radialGradient>
      <filter id="lglow" x="-80%" y="-80%" width="260%" height="260%">
        <feGaussianBlur stdDeviation="5" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <g id="leverG" filter="url(#lglow)">
      <g id="mount"></g>
      <path id="rodOuter" stroke="rgba(255,255,255,.26)" fill="none" stroke-linecap="round"/>
      <path id="rodCore"  stroke="rgba(255,255,255,.88)" fill="none" stroke-linecap="round"/>
      <circle id="knobHalo" fill="#fff" opacity=".22"/>
      <circle id="knob" fill="url(#knobg)" stroke="rgba(255,255,255,.75)"/>
      <circle id="knobLip" fill="none" stroke="rgba(255,255,255,.34)"/>
    </g>
  </svg>
  <div id="panel">
    <div id="reels"></div>
    <div id="sweeps"></div>
    <div id="spec"></div>
    <div id="rim"></div>
    <div id="flash"></div>
  </div>
</div>

<svg width="0" height="0" style="position:absolute">
  <filter id="liquid" x="-20%" y="-20%" width="140%" height="140%"
          color-interpolation-filters="sRGB">
    <feTurbulence id="turb" type="fractalNoise" baseFrequency="0.010 0.014"
                  numOctaves="2" seed="9" result="noise"/>
    <feGaussianBlur in="noise" stdDeviation="1.2" result="softnoise"/>
    <feDisplacementMap in="SourceGraphic" in2="softnoise" scale="18"
                       xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<script src="slot.js"></script>
