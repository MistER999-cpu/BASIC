<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* "survêt" fast-cut: vertical strips of shots that whip in and out on the
   music's beat grid, one colourway per bar, under the word set in a new
   typeface every half beat. It ends on the three colourways side by side
   under the logo. Everything is a pure function of t, so any frame can be
   rendered on its own and a render is reproducible from config + seed. */

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let CFG, W, H, P, SHOTS = {}, FONTS = [], END_FONT, LOGO, GRAIN = [], END_BG, END_FLOOR, TL;
let SCRATCH, FRAME, TALL = [], END_TMP;
const smooth = c => { const g = c.getContext('2d'); g.imageSmoothingQuality = 'high'; return c; };

/* ---- helpers ------------------------------------------------------------ */
function rng(seed) {
  let s = seed >>> 0;
  return () => {
    s = (s + 0x6D2B79F5) >>> 0;
    let x = s;
    x = Math.imul(x ^ (x >>> 15), x | 1);
    x ^= x + Math.imul(x ^ (x >>> 7), x | 61);
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
  };
}
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, p) => a + (b - a) * p;
const easeOutExpo = p => p >= 1 ? 1 : 1 - Math.pow(2, -10 * p);
const easeInOut = p => p < .5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3) / 2;
const easeOutCubic = p => 1 - Math.pow(1 - p, 3);
const beatTime = b => CFG.music.offset + b * P;           // beat -> seconds
const beatAt = t => (t - CFG.music.offset) / P;            // seconds -> beat
const rgb = c => `rgb(${c.map(Math.round).join(',')})`;
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const rgba = (c, a) => `rgba(${c.map(Math.round).join(',')},${a})`;

function deck(items, rand) {
  let pile = [], last;
  return () => {
    if (!pile.length) {
      pile = items.slice();
      for (let i = pile.length - 1; i > 0; i--) {
        const j = Math.floor(rand() * (i + 1));
        [pile[i], pile[j]] = [pile[j], pile[i]];
      }
      if (pile.length > 1 && pile[pile.length - 1] === last) pile.unshift(pile.pop());
    }
    return last = pile.pop();
  };
}

/* ---- subject analysis ----------------------------------------------------
   The backdrop is a near-neutral grey; the model is saturated (sand, brown,
   skin) or dark (charcoal, hair). Masking on that finds where she is in the
   frame, so crops can be aimed at her instead of at the frame centre. */
function analyse(im) {
  const w = 72, h = Math.round(72 * im.naturalHeight / im.naturalWidth);
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d', { willReadFrequently: true });
  g.drawImage(im, 0, 0, w, h);
  const px = g.getImageData(0, 0, w, h).data;
  const cols = new Float64Array(w), rows = new Float64Array(h), mask = new Uint8Array(w * h);
  let mass = 0, sx = 0, bg = [0, 0, 0], nbg = 0, fl = [0, 0, 0], nfl = 0;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = 4 * (y * w + x), r = px[i], gg = px[i + 1], b = px[i + 2];
    const mx = Math.max(r, gg, b), mn = Math.min(r, gg, b);
    const lum = 0.299 * r + 0.587 * gg + 0.114 * b;
    const sat = mx ? (mx - mn) / mx : 0;
    const subject = (sat > 0.16 && lum < 240) || lum < 105;
    if (subject) { cols[x]++; rows[y]++; mass++; sx += x + 0.5; mask[y * w + x] = 1; }
    else if (y < h * 0.15) { bg[0] += r; bg[1] += gg; bg[2] += b; nbg++; }
    else if (y > h * 0.85) { fl[0] += r; fl[1] += gg; fl[2] += b; nfl++; }
  }
  const quant = (arr, q) => {
    let acc = 0;
    for (let i = 0; i < arr.length; i++) { acc += arr[i]; if (acc >= q * mass) return (i + 0.5) / arr.length; }
    return 1;
  };
  // top and bottom by occupancy rather than by mass: the hair and the
  // trainers are thin rows of mask but they are where she starts and ends.
  // Only her own columns count, so a dark vignette in a corner does not.
  const x0 = quant(cols, 0.03), x1 = quant(cols, 0.97);
  const band = y => {
    let n = 0;
    for (let x = Math.floor(x0 * w); x < Math.ceil(x1 * w); x++) n += mask[y * w + x];
    return n;
  };
  let y0 = 0, y1 = h - 1;
  while (y0 < h - 1 && band(y0) < 2) y0++;
  while (y1 > 0 && band(y1) < 2) y1--;
  // where her head is across the frame: the mask's centre over her top rows
  let hm = 0, hs = 0;
  for (let y = y0; y <= y0 + 0.15 * (y1 - y0); y++) for (let x = 0; x < w; x++) {
    if (mask[y * w + x]) { hm++; hs += x + 0.5; }
  }
  const a = {
    cx: mass ? sx / mass / w : 0.5,
    hx: hm ? hs / hm / w : (mass ? sx / mass / w : 0.5),
    x0, x1,
    y0: y0 / h, y1: (y1 + 1) / h,
    fill: mass / (w * h),
    bg: nbg ? bg.map(v => v / nbg) : [190, 190, 192],
    floor: nfl ? fl.map(v => v / nfl) : [210, 210, 212],
  };
  a.closeup = (a.x1 - a.x0) > 0.7 || a.fill > 0.42;
  return a;
}

/* ---- loading ------------------------------------------------------------ */
function loadImage(url) {
  const im = new Image();
  im.src = url;
  return im.decode().then(() => im);
}

/* Some generated "charcoal" shots drifted green. Re-tint only the dark pixels
   whose green runs above their red (the garment; hair and skin run warm) to
   the charcoal swatch's own warm-neutral cast. */
function neutralise(im, target) {
  const c = document.createElement('canvas');
  c.width = im.naturalWidth; c.height = im.naturalHeight;
  const g = c.getContext('2d', { willReadFrequently: true });
  g.drawImage(im, 0, 0);
  const d = g.getImageData(0, 0, c.width, c.height), px = d.data;
  const tl = 0.299 * target[0] + 0.587 * target[1] + 0.114 * target[2];
  const tc = target.map(v => v - tl);
  for (let i = 0; i < px.length; i += 4) {
    const r = px[i], gg = px[i + 1], b = px[i + 2];
    const l = 0.299 * r + 0.587 * gg + 0.114 * b;
    if (l > 120 || gg < r - 1) continue;
    const w = clamp((120 - l) / 45, 0, 1) * clamp((gg - r + 1) / 4, 0, 1);
    const k = l / tl;
    px[i]     = lerp(r,  l + tc[0] * k, w);
    px[i + 1] = lerp(gg, l + tc[1] * k, w);
    px[i + 2] = lerp(b,  l + tc[2] * k, w);
  }
  g.putImageData(d, 0, 0);
  return loadImage(c.toDataURL('image/png'));
}

async function load(cfg) {
  CFG = cfg;
  W = canvas.width = cfg.output.width;
  H = canvas.height = cfg.output.height;
  P = 60 / cfg.music.bpm;
  const canvasOf = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return smooth(c); };
  SCRATCH = canvasOf(W, H);
  FRAME = canvasOf(W, H);
  END_TMP = canvasOf(W, H);
  // motion blur works on a strip extended by the blur length above and below
  TALL = [0, 1, 2].map(() => canvasOf(Math.ceil(W / 2), H + 2 * (MAX_BLUR + 4)));
  smooth(canvas);

  const jobs = [];
  for (const [colour, list] of Object.entries(cfg.shots)) {
    SHOTS[colour] = list.map(s => ({ name: s.name, colour }));
    list.forEach((s, i) => jobs.push(loadImage(s.url)
      .then(im => (cfg.grade || {})[s.name] === 'neutral' ? neutralise(im, hex(cfg.colours.black)) : im)
      .then(im => {
        SHOTS[colour][i].im = im;
        SHOTS[colour][i].a = analyse(im);
      })));
  }
  jobs.push(loadImage(cfg.end.logoUrl).then(im => { LOGO = im; }));
  FONTS = cfg.fonts.map((f, i) => {
    const family = `survet${i}`;
    const face = new FontFace(family, `url("${f.url}")`, { weight: String(f.weight || 400) });
    document.fonts.add(face);
    jobs.push(face.load());
    return { family, weight: f.weight || 400, file: f.file };
  });
  const endFace = new FontFace('survetEnd', `url("${cfg.end.fontUrl}")`, { weight: '400 800' });
  document.fonts.add(endFace);
  jobs.push(endFace.load());
  END_FONT = 'survetEnd';
  await Promise.all(jobs);

  // film grain: a few seeded tiles, one per frame in rotation
  const rand = rng(cfg.seed * 7919);
  for (let k = 0; k < 6; k++) {
    const c = document.createElement('canvas');
    c.width = c.height = 256;
    const g = c.getContext('2d');
    const img = g.createImageData(256, 256);
    for (let i = 0; i < img.data.length; i += 4) {
      const v = 128 + (rand() + rand() + rand() - 1.5) * 110;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
      img.data[i + 3] = 255;
    }
    g.putImageData(img, 0, 0);
    GRAIN.push(c);
  }

  // the end card's page colour is the average of its three backdrops
  const ends = cfg.end.order.map(endShot);
  END_BG = [0, 1, 2].map(k => ends.reduce((s, e) => s + e.a.bg[k], 0) / ends.length);
  END_FLOOR = [0, 1, 2].map(k => ends.reduce((s, e) => s + e.a.floor[k], 0) / ends.length);

  TL = timeline();
  return {
    shots: Object.fromEntries(Object.entries(SHOTS).map(([k, v]) =>
      [k, v.map(s => ({ name: s.name, ...Object.fromEntries(Object.entries(s.a).map(([kk, vv]) =>
        [kk, Array.isArray(vv) ? vv.map(Math.round) : typeof vv === 'number' ? +vv.toFixed(3) : vv])) }))])),
    fonts: FONTS.length,
    endBg: END_BG.map(Math.round),
    cuts: TL.strips.map(s => s.map(e => ({
      beat: +e.beat.toFixed(3), t: +e.t.toFixed(3), colour: e.colour,
      shot: e.shot.name, framing: e.framing.end ? 'end' : e.framing.name }))),
    fontSeq: TL.fontSeq.slice(0, 32).map(i => FONTS[i].file),
  };
}

/* ---- timeline ----------------------------------------------------------- */
function endShot(colour) {
  const list = SHOTS[colour];
  return list.find(s => /end/i.test(s.name)) || list[0];
}

function timeline() {
  const rand = rng(CFG.seed);
  const n = CFG.strips.count, keep = CFG.end.order.length;
  const colours = Object.keys(CFG.colours);
  const colourDeck = deck(colours, rand);
  const all = Object.values(SHOTS).flat();
  const shotNamed = name => {
    const s = all.find(x => x.name === name);
    if (!s) throw new Error(`no shot named ${name}`);
    return s;
  };
  const framingNamed = name => CFG.framings.find(f => f.name === name) || CFG.framings[0];
  const avoid = CFG.avoid || {};
  // the crops a shot can take: close-ups are never zoomed further, and some
  // crops are ruled out per shot (a faceless back of a head, a branded shoe)
  const allowed = shot => {
    const ok = CFG.framings.filter(f => !(shot.a.closeup && f.z > 1.2) && !(avoid[shot.name] || []).includes(f.name));
    return ok.length ? ok : [CFG.framings[0]];
  };

  // every cut as (strip, beat); dealt below in time order
  const cuts = [];
  CFG.sections.forEach((sec, si) => {
    if (sec.picks) {
      // a curated run, for the intro that doubles as the feed thumbnail
      for (const pk of sec.picks) {
        const shot = shotNamed(pk.shot);
        cuts.push({ strip: pk.strip, beat: sec.start + pk.beat, colour: shot.colour, shot,
                    framing: framingNamed(pk.framing || 'full'), dir: pk.strip % 2 ? -1 : 1 });
      }
      return;
    }
    const pickColour = sec.deck ? deck(sec.deck, rand) : colourDeck;
    for (let i = 0; i < n; i++) {
      const dir = ((i + si) % 2) ? -1 : 1;
      const at = [];
      if (sec.first != null) at.push(sec.start + sec.first);
      for (let b = sec.start + (sec.phase || 0) + i * sec.stagger; b < sec.end - 1e-6; b += sec.every) at.push(b);
      for (const b of at) {
        // a strip that closes for the end card holds what it has
        if (i >= keep && b > CFG.end.beat - 0.5) continue;
        cuts.push({ strip: i, beat: b, colour: sec.colour === 'mix' ? null : sec.colour, dir, pickColour });
      }
    }
  });
  cuts.sort((a, b) => a.beat - b.beat || a.strip - b.strip);

  // deal: never the photo this strip or its neighbours already show; of the
  // rest, the one used longest ago, in a crop it has not had recently
  const strips = Array.from({ length: n }, () => []);
  const showing = Array(n).fill(null), framed = Array(n).fill(null);
  const lastUsed = new Map();
  let clock = 0;
  const oldest = (items, key) => items
    .map(x => ({ x, k: (lastUsed.get(key(x)) || 0) + rand() * 0.5 }))
    .sort((p, q) => p.k - q.k)[0].x;
  for (const c of cuts) {
    clock++;
    if (!c.shot) {
      if (!c.colour) {
        const near = [showing[c.strip - 1], showing[c.strip + 1]].filter(Boolean).map(s => s.colour);
        for (let k = 0; k < 6 && (!c.colour || near.includes(c.colour)); k++) c.colour = c.pickColour();
      }
      const banned = [showing[c.strip], showing[c.strip - 1], showing[c.strip + 1]];
      let pool = SHOTS[c.colour].filter(s => !banned.includes(s));
      if (!pool.length) pool = SHOTS[c.colour].filter(s => s !== showing[c.strip]);
      if (!pool.length) pool = SHOTS[c.colour];
      c.shot = oldest(pool, s => s.name);
      let crops = allowed(c.shot).filter(f => !framed[c.strip] || f.name !== framed[c.strip].name);
      if (!crops.length) crops = allowed(c.shot);
      c.framing = oldest(crops, f => c.shot.name + '/' + f.name);
    }
    lastUsed.set(c.shot.name, clock);
    lastUsed.set(c.shot.name + '/' + c.framing.name, clock);
    strips[c.strip].push({ t: beatTime(c.beat), beat: c.beat, colour: c.colour, shot: c.shot,
                           framing: c.framing, dir: c.dir });
    showing[c.strip] = c.shot;
    framed[c.strip] = c.framing;
  }

  // the end card: one strip per colourway, the spare strips close
  const E = CFG.end;
  E.order.forEach((colour, i) => {
    strips[i].push({ t: beatTime(E.beat + i * E.stagger), beat: E.beat + i * E.stagger, colour,
                     shot: endShot(colour), framing: { end: true }, dir: i % 2 ? -1 : 1, col: i });
  });

  for (const s of strips) {
    s.sort((a, b) => a.t - b.t);
    for (let k = s.length - 2; k >= 0; k--) {
      if (s[k + 1].t - s[k].t < CFG.cut.slide * 0.75) s.splice(k, 1);
    }
  }

  const fontDeck = deck(FONTS.map((_, i) => i), rand);
  const fontSeq = Array.from({ length: 200 }, fontDeck);
  const drop = FONTS.findIndex(f => f.file === CFG.dropFont);
  if (drop >= 0) {
    const j = fontSeq.indexOf(drop);
    fontSeq.splice(j, 1);
    fontSeq.unshift(drop);
    if (fontSeq[1] === drop) fontSeq.push(fontSeq.splice(1, 1)[0]);
  }
  return { strips, fontSeq };
}

/* ---- strips ------------------------------------------------------------- */
function stripLayout(t) {
  const n = CFG.strips.count, gap = CFG.strips.gap, keep = CFG.end.order.length;
  const p = easeInOut(clamp((t - beatTime(CFG.end.beat)) / 0.35, 0, 1));
  const weights = Array.from({ length: n }, (_, i) => i < keep ? 1 : 1 - p);
  // the gaps between the columns that stay close too, so the end card reads
  // as one backdrop
  const gp = endGapClose(t);
  const gaps = gap * (keep - 1) * (1 - gp) + gap * (n - keep) * (1 - p);
  const unit = (W - gaps) / weights.reduce((a, b) => a + b, 0);
  // the gap in front of a closing strip closes with it
  let x = 0;
  return weights.map((w, i) => {
    if (i > 0) x += gap * Math.min(1, w) * (i < keep ? 1 - gp : 1);
    const r = { x, w: w * unit };
    x += r.w;
    return r;
  });
}

function endGapClose(t) {
  return easeInOut(clamp((t - beatTime(CFG.end.beat + 0.5)) / 0.4, 0, 1));
}

/* where the end card's figure sits: her full height between the tagline and
   the bottom of the frame, centred on her in the column */
function endPlacement(shot, sw, col) {
  const a = shot.a, im = shot.im, ih = im.naturalHeight, iw = im.naturalWidth;
  const top = endLayout().figureTop;
  const s = (CFG.end.subjectBottom - top) / ((a.y1 - a.y0) * ih);
  let dy = top - a.y0 * ih * s;
  dy = Math.max(dy, H - ih * s);                // never leave a gap under her
  let dx = sw / 2 - a.cx * iw * s;
  // the outer columns keep all of her inside the frame
  if (col === 0) dx = Math.max(dx, 14 - a.x0 * iw * s);
  if (col === CFG.end.order.length - 1) dx = Math.min(dx, sw - 14 - a.x1 * iw * s);
  dx = clamp(dx, sw - iw * s, 0);
  return { s, dx, dy, dw: iw * s, dh: ih * s };
}

function drawShot(c, ev, sw, yOff, held) {
  const im = ev.shot.im, iw = im.naturalWidth, ih = im.naturalHeight, a = ev.shot.a;

  if (ev.framing.end) {
    const p = endPlacement(ev.shot, sw, ev.col);
    // the page: the photos' own backdrop, from its top colour down to the floor
    const pg = c.createLinearGradient(0, 0, 0, H);
    pg.addColorStop(0, rgb(END_BG));
    pg.addColorStop(0.45, rgb(END_BG));
    pg.addColorStop(1, rgb(END_FLOOR));
    c.fillStyle = pg;
    c.fillRect(0, -H, sw, 3 * H);
    // the photo, feathered into the page above her head and along the edges it
    // shares with the other columns
    const y = p.dy + yOff;
    const f = clamp(endLayout().figureTop - 24 - p.dy, 60, 420);
    const t = END_TMP.getContext('2d');
    t.globalCompositeOperation = 'copy';
    t.drawImage(im, p.dx, y, p.dw, p.dh);
    t.globalCompositeOperation = 'destination-in';
    const vg = t.createLinearGradient(0, y, 0, y + f);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(0.6, 'rgba(0,0,0,0.75)');
    vg.addColorStop(1, 'rgba(0,0,0,1)');
    t.fillStyle = vg;
    t.fillRect(0, 0, sw, H);
    const e = 36, last = CFG.end.order.length - 1;
    const hg = t.createLinearGradient(0, 0, sw, 0);
    hg.addColorStop(0, `rgba(0,0,0,${ev.col > 0 ? 0 : 1})`);
    hg.addColorStop(e / sw, 'rgba(0,0,0,1)');
    hg.addColorStop(1 - e / sw, 'rgba(0,0,0,1)');
    hg.addColorStop(1, `rgba(0,0,0,${ev.col < last ? 0 : 1})`);
    t.fillStyle = hg;
    t.fillRect(0, 0, sw, H);
    t.globalCompositeOperation = 'source-over';
    c.drawImage(END_TMP, 0, 0, sw, H, 0, 0, sw, H);
    return;
  }

  const f = ev.framing, { drift, breathe } = CFG.cut;
  const z = f.z * (1 + breathe * clamp(held, 0, 1.5));
  const s = Math.max(sw / iw, H / ih) * z;
  const dw = iw * s, dh = ih * s;
  // head and upper-body crops aim at her face, the rest at her body
  const fx = clamp((f.at != null && f.at <= 0.3 ? a.hx : a.cx) + (f.dx || 0), 0, 1);
  const fy = f.at == null ? 0.5 : a.y0 + f.at * (a.y1 - a.y0);
  let dx = sw / 2 - fx * dw;
  let dy = H / 2 - fy * dh + ev.dir * drift * held;
  dy = clamp(dy, H - dh, 0);
  // a face in view is never sliced by the strip's edge
  const headY = (a.y0 + 0.07 * (a.y1 - a.y0)) * dh + dy;
  if (headY > -0.05 * H && headY < 1.05 * H) {
    const face = a.hx * dw + dx;
    dx += clamp(face, sw * 0.3, sw * 0.7) - face;
  }
  dx = clamp(dx, sw - dw, 0);
  c.drawImage(im, dx, dy + yOff, dw, dh);
}

/* the strip's cut in force at t and how far its whip has got */
function cutAt(events, t) {
  let k = -1;
  for (let j = 0; j < events.length && events[j].t <= t; j++) k = j;
  return k;
}
const progress = (ev, t) => easeOutExpo(clamp((t - ev.t) / CFG.cut.slide, 0, 1));

/* paint strip i into c (already translated so the strip's top is at 0); pad
   rows above and below are painted too, for the motion blur to draw on */
function paintStrip(c, events, sw, t, pad = 0, p = null) {
  c.fillStyle = CFG.gap;
  c.fillRect(0, -pad, sw, H + 2 * pad);
  const k = cutAt(events, t);
  if (k < 0) return;
  const cur = events[k], prev = events[k - 1];
  if (p == null) p = progress(cur, t);
  if (p < 1 && prev) drawShot(c, prev, sw, cur.dir * H * p, t - prev.t);
  drawShot(c, cur, sw, -cur.dir * H * (1 - p), t - cur.t);
}

/* vertical box blur of length L over the top `h` rows of src, by doubling:
   each pass averages the running box with a shifted copy of itself (or adds
   one shifted sample), so there are about 2·log2(L) blends instead of L, and
   8-bit rounding never compounds into banding. Taps cover y-(L-1)..y. */
function boxBlurV(src, sw, h, L) {
  let [A, B] = [TALL[1], TALL[2]];
  const a = A.getContext('2d');
  a.globalCompositeOperation = 'copy';
  a.drawImage(src, 0, 0, sw, h, 0, 0, sw, h);
  a.globalCompositeOperation = 'source-over';
  let n = 1;
  for (const bit of L.toString(2).slice(1)) {
    for (const add of bit === '1' ? [false, true] : [false]) {
      const b = B.getContext('2d');
      b.globalCompositeOperation = 'copy';
      b.drawImage(A, 0, 0, sw, h, 0, 0, sw, h);
      b.globalCompositeOperation = 'source-over';
      b.globalAlpha = add ? 1 / (n + 1) : 0.5;
      b.drawImage(add ? src : A, 0, 0, sw, h - n, 0, n, sw, h - n);
      b.globalAlpha = 1;
      [A, B] = [B, A];
      n = add ? n + 1 : n * 2;
    }
  }
  return A;
}

const MAX_BLUR = 1200;
function drawStrips(g, t) {
  const lay = stripLayout(t);
  const { shutter } = CFG.cut;
  TL.strips.forEach((events, i) => {
    const { x, w } = lay[i];
    if (w < 1) return;
    const sw = Math.ceil(w);
    g.save();
    g.beginPath(); g.rect(x, 0, w, H); g.clip();
    // Both photos in a strip move together, so its motion blur over the
    // shutter is a vertical box blur as long as the distance they travel.
    const k = cutAt(events, t + shutter / 2);
    const ev = events[k];
    const p0 = ev ? progress(ev, t - shutter / 2) : 1, p1 = ev ? progress(ev, t + shutter / 2) : 1;
    const L = Math.min(MAX_BLUR, Math.round(H * Math.abs(p1 - p0)));
    if (L < 2) {
      const sc = SCRATCH.getContext('2d');
      paintStrip(sc, events, sw, t);
      g.drawImage(SCRATCH, 0, 0, sw, H, x, 0, sw, H);
    } else {
      const pad = L + 2, h = H + 2 * pad;
      const tc = TALL[0].getContext('2d');
      tc.setTransform(1, 0, 0, 1, 0, pad);
      // composed at the middle of the shutter, inside the cut it belongs to
      paintStrip(tc, events, sw, Math.max(t, ev.t), pad, (p0 + p1) / 2);
      tc.setTransform(1, 0, 0, 1, 0, 0);
      const out = boxBlurV(TALL[0], sw, h, L);
      g.drawImage(out, 0, pad + Math.floor((L - 1) / 2), sw, H, x, 0, sw, H);
    }
    g.restore();
  });
}

/* ---- word --------------------------------------------------------------- */
/* whichever cut's photo sits behind height y in strip i at t */
function eventBehind(i, t, y) {
  const events = TL.strips[i];
  let k = -1;
  for (let j = 0; j < events.length && events[j].t <= t; j++) k = j;
  if (k < 0) return null;
  const cur = events[k], prev = events[k - 1];
  const p = easeOutExpo(clamp((t - cur.t) / CFG.cut.slide, 0, 1));
  const top = -cur.dir * H * (1 - p);              // where the incoming photo is
  return (!prev || (y >= top && y < top + H)) ? cur : prev;
}

/* relative luminance and WCAG contrast */
const lin = v => (v /= 255) <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
const luminance = c => 0.2126 * lin(c[0]) + 0.7152 * lin(c[1]) + 0.0722 * lin(c[2]);
const contrast = (l1, l2) => (Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05);

/* The word's colour over a cut: the palette colour that stands out most from
   what that photo actually shows behind the word once it has settled (a sand
   garment and the pale backdrop both want charcoal; black and brown want sand).
   Measured once per cut, so a slice never flickers while its photo drifts. */
let PROBE;
function inkFor(ev, sw) {
  if (CFG.text.mode === 'match') return CFG.colours[ev.colour];
  ev.ink = ev.ink || {};
  const key = Math.round(sw);
  if (ev.ink[key]) return ev.ink[key];
  const band = Math.round(H * CFG.text.maxHeight);
  if (!PROBE) { PROBE = document.createElement('canvas'); PROBE.width = W; PROBE.height = band; }
  const c = PROBE.getContext('2d', { willReadFrequently: true });
  c.setTransform(1, 0, 0, 1, 0, -(H * CFG.text.y - band / 2));
  drawShot(c, ev, key, 0, CFG.cut.slide + 0.3);
  c.setTransform(1, 0, 0, 1, 0, 0);
  const px = c.getImageData(0, 0, key, band).data;
  let sum = 0, n = 0;
  for (let i = 0; i < px.length; i += 16) { sum += luminance([px[i], px[i + 1], px[i + 2]]); n++; }
  const bg = sum / n;
  let best = null, bestC = 0;
  for (const hexc of Object.values(CFG.colours)) {
    const k = contrast(luminance(hex(hexc)), bg);
    if (k > bestC) { bestC = k; best = hexc; }
  }
  return ev.ink[key] = best;
}

/* run fn once per strip with the canvas clipped to that strip's slice of the
   frame (the gap after a strip belongs to it) and the cut behind height y */
function perStrip(g, t, y, fn) {
  const lay = stripLayout(t);
  lay.forEach((r, i) => {
    if (r.w < 1) return;
    const ev = eventBehind(i, t, y);
    if (!ev) return;
    const x0 = i === 0 ? 0 : r.x;
    const x1 = i + 1 < lay.length && lay[i + 1].w >= 1 ? lay[i + 1].x : W;
    g.save();
    g.beginPath(); g.rect(x0, 0, x1 - x0, H); g.clip();
    fn(ev, Math.ceil(r.w));
    g.restore();
  });
}

/* ink box of a word in a font at a size */
function ink(g, word, font, size, spacing = 0) {
  g.font = `${font.weight} ${size}px "${font.family}"`;
  g.letterSpacing = `${spacing}px`;
  const m = g.measureText(word);
  return { l: m.actualBoundingBoxLeft, r: m.actualBoundingBoxRight,
           a: m.actualBoundingBoxAscent, d: m.actualBoundingBoxDescent };
}

/* the size at which a word fills the target width (or hits the height cap) */
function fitSize(g, word, font, targetW, maxH) {
  const m = ink(g, word, font, 200);
  return 200 * Math.min(targetW / (m.l + m.r), maxH / (m.a + m.d));
}

/* draw a word centred on its own ink rather than its advance box */
function drawCentred(g, word, font, size, cx, cy, colour, spacing = 0) {
  const m = ink(g, word, font, size, spacing);
  g.fillStyle = colour;
  g.fillText(word, cx - (m.r - m.l) / 2, cy + (m.a - m.d) / 2);
  g.letterSpacing = '0px';
  return { top: cy - (m.a + m.d) / 2, bottom: cy + (m.a + m.d) / 2 };
}

function drawWord(g, t) {
  const T = CFG.text, b = beatAt(t);
  if (b < T.appearBeat) return;
  if (b >= CFG.end.beat) return;
  const step = Math.floor((b - T.appearBeat) / T.fontEvery);
  const since = t - beatTime(T.appearBeat + step * T.fontEvery);
  // the first word slams in on the drop, the rest just pop
  const kick = step === 0 ? 0.45 : 0.07;
  const pop = 1 + kick * (1 - easeOutExpo(clamp(since / (step === 0 ? 0.22 : 0.1), 0, 1)));
  const font = FONTS[TL.fontSeq[step % TL.fontSeq.length]];
  const size = fitSize(g, CFG.word, font, W * T.width, H * T.maxHeight) * pop;
  // set strip by strip, each slice coloured against the photo behind it, so
  // the word stays readable when the strips hold different colourways and the
  // slicing follows the edit's own vertical cuts
  const y = H * T.y;
  perStrip(g, t, y, (ev, sw) => drawCentred(g, CFG.word, font, size, W / 2, y, inkFor(ev, sw)));
}

/* ---- end card ----------------------------------------------------------- */
function endLayout() {
  const E = CFG.end;
  const logoH = E.logoWidth * LOGO.naturalHeight / LOGO.naturalWidth;
  const logoBottom = E.logoTop + logoH;
  const taglineY = logoBottom + 30 + E.tagline * 0.6;
  const dotsY = taglineY + E.tagline * 0.6 + 28 + E.swatch;
  return { logoH, taglineY, dotsY, figureTop: dotsY + E.swatch + 52 };
}

function drawEnd(g, t) {
  const E = CFG.end, b = beatAt(t);
  if (b < E.beat) return;
  const L = endLayout();

  // the word travels from the middle of the frame up to become the tagline:
  // heavy and coloured slice by slice while it is still over the strips,
  // settling light and in the logo's ink once it is on the page
  const mv = easeInOut(clamp((t - beatTime(E.beat)) / 0.45, 0, 1));
  const word = CFG.word.toUpperCase();
  const font = { family: END_FONT, weight: Math.round(lerp(800, 500, mv)) };
  const from = fitSize(g, word, font, W * CFG.text.width, H * CFG.text.maxHeight);
  const size = lerp(from, E.tagline, mv);
  const spacing = lerp(0, E.tagline * 0.4, mv);
  const y = lerp(H * CFG.text.y, L.taglineY, mv);
  const ink = hex(E.taglineInk);
  if (mv < 1) {
    perStrip(g, t, H * CFG.text.y, (ev, sw) => {
      const c = hex(inkFor(ev, sw)).map((v, k) => lerp(v, ink[k], mv));
      drawCentred(g, word, font, size, W / 2, y, rgb(c), spacing);
    });
  } else {
    drawCentred(g, word, font, size, W / 2, y, E.taglineInk, spacing);
  }

  // logo, then the three colourways as swatches
  const lp = easeOutCubic(clamp((t - beatTime(E.logoBeat)) / 0.35, 0, 1));
  if (lp > 0) {
    g.save();
    g.globalAlpha = lp;
    const sc = 1 + 0.05 * (1 - lp);
    const w = E.logoWidth * sc, h = L.logoH * sc;
    g.drawImage(LOGO, W / 2 - w / 2, E.logoTop + L.logoH / 2 - h / 2, w, h);
    g.restore();
  }
  E.order.forEach((c, i) => {
    const dp = easeOutCubic(clamp((t - beatTime(E.logoBeat + 0.25 + i * 0.25)) / 0.25, 0, 1));
    if (dp <= 0) return;
    g.fillStyle = CFG.colours[c];
    g.beginPath();
    g.arc(W / 2 + (i - 1) * E.swatchGap, L.dotsY, E.swatch * dp, 0, Math.PI * 2);
    g.fill();
  });
}

/* ---- frame -------------------------------------------------------------- */
function pulse(beats, amount, decay, t) {
  let v = 0;
  for (const b of beats) {
    // measured from the first frame at or after the beat, so every hit peaks
    // on a frame that is actually rendered
    const fps = CFG.output.fps;
    const d = t - Math.ceil(beatTime(b) * fps - 1e-6) / fps;
    if (d >= 0) v = Math.max(v, amount * Math.exp(-d / decay * 3));
  }
  return v;
}

/* the logo opens the ad over the intro strips, sliced and coloured against
   each strip like the word, so the brand is on the first frame (the feed
   thumbnail); the word replaces it on the drop */
let TINTED;
function tintedLogo(colour) {
  TINTED = TINTED || {};
  if (!TINTED[colour]) {
    const c = document.createElement('canvas');
    c.width = LOGO.naturalWidth; c.height = LOGO.naturalHeight;
    const g = c.getContext('2d');
    g.drawImage(LOGO, 0, 0);
    g.globalCompositeOperation = 'source-in';
    g.fillStyle = colour;
    g.fillRect(0, 0, c.width, c.height);
    TINTED[colour] = c;
  }
  return TINTED[colour];
}

function drawOpener(g, t) {
  const O = CFG.opener;
  if (!O) return;
  const b = beatAt(t);
  if (b >= CFG.text.appearBeat) return;
  const w = O.width, h = w * LOGO.naturalHeight / LOGO.naturalWidth;
  const y = H * CFG.text.y - h / 2;
  perStrip(g, t, H * CFG.text.y, (ev, sw) =>
    g.drawImage(tintedLogo(inkFor(ev, sw)), W / 2 - w / 2, y, w, h));
}

function draw(t) {
  const g = FRAME.getContext('2d');
  g.globalAlpha = 1;
  g.globalCompositeOperation = 'source-over';
  // the light gaps between strips melt into the end card's page as it lands
  const gp = easeInOut(clamp((t - beatTime(CFG.end.beat + 0.5)) / 0.4, 0, 1));
  g.fillStyle = rgb(hex(CFG.gap).map((v, k) => lerp(v, END_BG[k], gp)));
  g.fillRect(0, 0, W, H);
  drawStrips(g, t);
  drawOpener(g, t);
  drawWord(g, t);
  drawEnd(g, t);

  // the whole frame punches in a touch on each bar's downbeat
  const z = 1 + pulse(CFG.punch.beats, CFG.punch.amount, CFG.punch.decay, t);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(FRAME, W / 2 - W * z / 2, H / 2 - H * z / 2, W * z, H * z);

  const fl = pulse(CFG.flash.beats, CFG.flash.amount, CFG.flash.decay, t);
  if (fl > 0.002) {
    ctx.fillStyle = `rgba(255,255,255,${fl})`;
    ctx.fillRect(0, 0, W, H);
  }

  if (CFG.grain > 0) {
    const tile = GRAIN[Math.floor(t * CFG.output.fps + 0.5) % GRAIN.length];
    ctx.globalCompositeOperation = 'overlay';
    ctx.globalAlpha = CFG.grain;
    ctx.fillStyle = ctx.createPattern(tile, 'repeat');
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
  }
}

window.SURVET = { load, draw };
</script>
</body>
